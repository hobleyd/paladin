name: paladin-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION_FULL%%+*}" >> $GITHUB_OUTPUT

      - name: Push version tag
        uses: EndBug/latest-tag@latest
        with:
          tag-name: ${{ steps.version.outputs.version }}

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      - name: Create key.properties
        run: |
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEY_BASE_64 }}
        run: printf '%s' "$ENCODED_STRING" | base64 -di > android/app/keystore.jks

      - run: flutter build apk --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'paladin-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'build/app/outputs/apk/release/paladin-${{ needs.prepare.outputs.version }}-release.apk'
          generate_release_notes: true

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build macos --release --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Create dist structure for desktop_updater
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          mkdir -p "dist/${BUILD_NUMBER}/paladin-${VERSION}+${BUILD_NUMBER}-macos"
          cp -r "build/macos/Build/Products/Release/paladin.app" \
            "dist/${BUILD_NUMBER}/paladin-${VERSION}+${BUILD_NUMBER}-macos/paladin.app"

      - name: Generate file hashes
        run: dart run desktop_updater:archive macos

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/${{ needs.prepare.outputs.build_number }}/paladin-${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Create dist structure for desktop_updater
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          mkdir -p "dist/${BUILD_NUMBER}/paladin-${VERSION}+${BUILD_NUMBER}-windows"
          cp -r build/windows/x64/runner/Release/. \
            "dist/${BUILD_NUMBER}/paladin-${VERSION}+${BUILD_NUMBER}-windows/"

      - name: Generate file hashes
        run: dart run desktop_updater:archive windows

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/${{ needs.prepare.outputs.build_number }}/paladin-${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

  deploy:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS distribution
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

      - name: Download Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

      - name: Update app-archive.json
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          DATE=$(date +%Y-%m-%d)

          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RAW_COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          else
            RAW_COMMITS=$(git log --pretty=format:"%s" --no-merges | head -30)
          fi
          if [ -n "$RAW_COMMITS" ]; then
            CHANGES=$(echo "$RAW_COMMITS" | jq -R '{"message": .}' | jq -s '.')
          else
            CHANGES='[{"message": "Release '"$VERSION"'"}]'
          fi

          git fetch origin gh-pages 2>/dev/null || true
          git show origin/gh-pages:app-archive.json > current-archive.json 2>/dev/null \
            || echo '{"appName":"Paladin","description":"eLibrary management for Tablets and eInk devices.","items":[]}' > current-archive.json

          for PLATFORM in macos windows; do
            URL="https://hobleyd.github.io/paladin/releases/${VERSION}+${BUILD_NUMBER}-${PLATFORM}"
            jq --arg version "$VERSION" \
               --argjson short_version "$BUILD_NUMBER" \
               --arg date "$DATE" \
               --arg url "$URL" \
               --argjson changes "$CHANGES" \
               --arg platform "$PLATFORM" \
               '.items = (
                 [.items[] | select((.platform == $platform and .shortVersion == $short_version) | not)]
                 + [{
                   "version": $version,
                   "shortVersion": $short_version,
                   "changes": $changes,
                   "date": $date,
                   "mandatory": false,
                   "url": $url,
                   "platform": $platform
                 }]
               )' current-archive.json > updated-archive.json
            mv updated-archive.json current-archive.json
          done
          mv current-archive.json deploy/app-archive.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
