name: paladin-release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      # sqflite_common_ffi dlopens libsqlite3 for every test that touches the
      # database; ubuntu-latest usually already has it, but this is cheap
      # insurance against a runner image that doesn't.
      - name: Install sqlite3
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

  # Only runs for a push to main or a manual dispatch -- not for a pull
  # request, which has nothing to tag or release. Every job below needs this
  # one, so skipping it here cascades to skipping the rest of the workflow
  # for a PR automatically.
  prepare:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      # Both halves of the version come from pubspec.yaml, and the build number
      # is the one the in-app updater compares: desktop_updater decides "newer"
      # on the build number ALONE and never reaches the semver when both sides
      # have one, so this counter has to rise monotonically across the whole
      # published archive, forever. It used to be github.run_number, which is a
      # different sequence from pubspec's and so told every locally built app it
      # was permanently out of date. Bumping pubspec.yaml is now what publishes
      # an update on desktop, exactly as it already was on Android (and Android's
      # own installer refuses to "update" over a higher versionCode already on
      # the device, so this counter can never move backwards for either platform).
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION_FULL%%+*}"
          BUILD_NUMBER="${VERSION_FULL##*+}"
          # A missing or non-numeric +BUILD would publish build 0, which every
          # existing install compares as older than what it already has — a
          # release nobody is ever offered. Fail rather than publish that.
          case "$VERSION_FULL" in
            *+*) ;;
            *) echo "pubspec.yaml version '$VERSION_FULL' has no +BUILD suffix" >&2; exit 1 ;;
          esac
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "pubspec.yaml build number '$BUILD_NUMBER' is not a number" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION+$BUILD_NUMBER"

      - name: Push version tag
        uses: EndBug/latest-tag@latest
        with:
          tag-name: ${{ steps.version.outputs.version }}

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      - name: Create key.properties
        run: |
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEY_BASE_64 }}
        run: printf '%s' "$ENCODED_STRING" | base64 -di > android/app/keystore.jks

      - run: flutter build apk --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'paladin-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'build/app/outputs/apk/release/paladin-${{ needs.prepare.outputs.version }}-release.apk'
          generate_release_notes: true

  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      # `if:` conditions cannot reference the secrets context directly, so
      # gate signing/notarization steps on this instead.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      # Only a push to main (or a same-repo PR) carries these secrets; a
      # fork PR builds ad-hoc/unsigned exactly as before, so contributor CI
      # never fails for lacking a certificate it was never meant to have.
      # No provisioning profile needed: paladin's entitlements don't include
      # keychain-access-groups, the one thing that forces Manual signing to
      # demand one even for Developer ID (see nightmail's release.yml).
      - name: Import Developer ID signing certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Patch the checked-out (not committed) pbxproj so Release actually
          # signs with the Developer ID identity just imported. Left alone,
          # Release stays CODE_SIGN_STYLE=Automatic with no DEVELOPMENT_TEAM,
          # i.e. ad-hoc -- exactly what an unsigned/fork run should still get.
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path("macos/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          anchor = "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;\n"
          assert text.count(anchor) == 1, "Release Runner build-settings anchor not found or not unique -- pbxproj layout changed, update this patch"
          replacement = (
              "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n"
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Developer ID Application\";\n"
              "\t\t\t\tCODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO;\n"
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = 69XRMYD9XG;\n"
              "\t\t\t\tENABLE_HARDENED_RUNTIME = YES;\n"
              "\t\t\t\tOTHER_CODE_SIGN_FLAGS = \"--timestamp\";\n"
          )
          text = text.replace(anchor, replacement)

          # TargetAttributes.ProvisioningStyle is a separate, higher-precedence
          # setting Xcode's own UI maintains; per-config CODE_SIGN_STYLE alone
          # doesn't override it, so it has to move to Manual too.
          old_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Automatic;\n"
          assert text.count(old_attr) == 1, "ProvisioningStyle anchor not found or not unique"
          new_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Manual;\n"
          text = text.replace(old_attr, new_attr)

          path.write_text(text)
          EOF

      - run: flutter build macos --release --build-number ${{ needs.prepare.outputs.build_number }}

      # Resolved from disk, not written down: PRODUCT_NAME is "paladin"
      # (lowercase), so the real bundle is paladin.app, not Paladin.app.
      # Every later step (notarizing, the DMG, and desktop_updater's
      # --app-name) has to agree on this exact, case-correct name, or the
      # in-app updater fails outright -- see the --app-name comment on the
      # "Package release for desktop_updater" step below for what nightmail's
      # release.yml hit when a step guessed instead of resolving this.
      - name: Resolve app bundle name
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_BUNDLE_NAME=$(basename "$(ls -d "$APP_DIR"/*.app | head -1)")
          if [ -z "$APP_BUNDLE_NAME" ]; then
            echo "::error::no .app in $APP_DIR to build a DMG from" >&2
            exit 1
          fi
          echo "APP_BUNDLE_NAME=$APP_BUNDLE_NAME" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/$APP_BUNDLE_NAME"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/paladin-notarize.zip"
          # --wait exits 0 once Apple responds at all, Accepted or Invalid --
          # a rejection is not a CLI failure, so the status has to be checked
          # explicitly rather than relying on notarytool's own exit code.
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/paladin-notarize.zip" \
            --key "$RUNNER_TEMP/notary_key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ { print $2; exit }')
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization did not succeed -- fetching the detailed log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      # The in-app updater refuses a staged app if *any* entry in it is
      # group- or other-writable. desktop_updater's helper hashes the staged
      # bundle through macStageMode, which requires `mode & 0o022 == 0` on
      # every file and directory, and throws stageAuthenticationFailed on the
      # first one that is not -- reported to the user as the single sentence
      # "Unable to confirm update installation handoff", with no indication of
      # which file or even which check.
      #
      # Flutter ships MaterialIcons-Regular.otf at 0664 in its own SDK cache
      # (bin/cache/artifacts/material_fonts/) and copies it into
      # flutter_assets with the mode intact, so every macOS build carries one
      # group-writable file and no in-app update could ever install. It was
      # invisible from the installed app, because Finder normalises permissions
      # when it copies from a DMG -- the installed copy reads 0644 and only the
      # zip the updater downloads preserves 0664. That is exactly backwards
      # from where anyone would look. (Found via nightmail's release.yml,
      # which hit this first.)
      #
      # This runs after signing deliberately: permission bits are not part of
      # what codesign seals, so the signature, the designated requirement and
      # the stapled ticket all still validate afterwards.
      - name: Normalise bundle permissions for the updater
        run: |
          APP_PATH="build/macos/Build/Products/Release/$APP_BUNDLE_NAME"
          chmod -R go-w "$APP_PATH"
          find "$APP_PATH" -type d -exec chmod a+rx {} +
          find "$APP_PATH" -type f -exec chmod a+r {} +
          # Assert rather than trust: this is the whole of macStageMode, and a
          # future dependency that ships an odd mode must fail here, where the
          # file is named, rather than on a user's machine where it is not.
          python3 - "$APP_PATH" <<'PY'
          import os, stat as st, sys
          root = sys.argv[1]
          bad = []
          def check(path):
              s = os.lstat(path)
              if st.S_ISLNK(s.st_mode):
                  return
              mode = s.st_mode & 0o7777
              why = []
              if getattr(s, "st_flags", 0): why.append("st_flags set")
              if mode & 0o7000: why.append("setuid/setgid/sticky")
              if mode & 0o022: why.append("group/other writable")
              if st.S_ISDIR(s.st_mode):
                  if mode & 0o005 != 0o005: why.append("dir not other r-x")
              elif st.S_ISREG(s.st_mode):
                  if mode & 0o004 != 0o004: why.append("not other-readable")
                  if not (mode & 0o111 == 0 or mode & 0o101 == 0o101):
                      why.append("odd exec bits")
              else:
                  why.append("not a file, directory or symlink")
              if why:
                  bad.append(f"{oct(mode)} {', '.join(why)}: {os.path.relpath(path, root)}")
          check(root)
          for base, dirs, files in os.walk(root):
              for name in dirs + files:
                  check(os.path.join(base, name))
          for line in bad:
              print(f"::error::staged-bundle permission rule violated: {line}")
          sys.exit(1 if bad else 0)
          PY

      # create-dmg is called directly (as in inkworm/shackleton/nightmail's
      # release.yml) so the version can go in the DMG file name without also
      # having to claim the bundled app is called `paladin-<version>.app` --
      # the `--icon` and `--volname` are independent of the output file name.
      - name: Create DMG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APP_DIR="build/macos/Build/Products/Release"
          echo "Packaging $APP_BUNDLE_NAME as paladin-$VERSION.dmg"
          brew install create-dmg
          create-dmg \
            --volname "Paladin $VERSION" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "$APP_BUNDLE_NAME" 200 185 \
            --app-drop-link 600 185 \
            "paladin-$VERSION.dmg" \
            "$APP_DIR/$APP_BUNDLE_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'paladin-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'paladin-${{ needs.prepare.outputs.version }}.dmg'

      # --app-name must be the .app bundle's real on-disk name, because
      # desktop_updater's client stages the extracted zip at
      # <staging>/<descriptor.appName> (update_client.dart) -- it doesn't
      # look inside the archive for the app, it trusts this field. This job
      # previously hardcoded "Paladin" here (capitalised, no ".app"), which
      # doesn't match the real "paladin.app" bundle at all -- both halves of
      # the exact mistake nightmail's release.yml documents hitting. The zip
      # filename the packager writes is derived from --app-name too (its
      # ".app"/".exe" suffix stripped, case otherwise kept -- see
      # ZipReleasePackager._artifactNameStem), so --artifact-url has to be
      # built from the same resolved name, not a separately hand-picked one.
      - name: Package release for desktop_updater
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          ARTIFACT_STEM="${APP_BUNDLE_NAME%.app}"
          dart run desktop_updater:package \
            --input "build/macos/Build/Products/Release/$APP_BUNDLE_NAME" \
            --output "dist/${VERSION}+${BUILD_NUMBER}-macos" \
            --package-id au.com.sharpblue.paladin \
            --app-name "$APP_BUNDLE_NAME" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform macos \
            --channel stable \
            --artifact-url "https://hobleyd.github.io/paladin/releases/${VERSION}+${BUILD_NUMBER}-macos/${ARTIFACT_STEM}-${VERSION}-macos.zip" \
            --install-strategy wholeBundleReplace

      - name: Import release signing key
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign release descriptor
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          dart run desktop_updater:release sign \
            --release "dist/${VERSION}+${BUILD_NUMBER}-macos/release.json" \
            --key-profile desktop_updater.keys.json

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

      - name: Remove signing keychain
        if: ${{ always() && env.HAS_SIGNING_CERT == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --build-number ${{ needs.prepare.outputs.build_number }}

      # The in-app updater replaces the unpacked runner directory, not an
      # installer -- there is no packaged .exe uploaded to the GitHub Release
      # for Windows yet, only the desktop_updater distribution below.
      #
      # --app-name must match the real on-disk binary name for the same
      # reason as macOS's (see that job's comment): windows/CMakeLists.txt
      # sets BINARY_NAME "paladin" (lowercase), so this was previously wrong
      # in exactly the same way "Paladin" was wrong for macOS.
      - name: Package release for desktop_updater
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          APP_NAME="paladin"
          dart run desktop_updater:package \
            --input "build/windows/x64/runner/Release" \
            --output "dist/${VERSION}+${BUILD_NUMBER}-windows" \
            --package-id au.com.sharpblue.paladin \
            --app-name "$APP_NAME" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform windows \
            --channel stable \
            --artifact-url "https://hobleyd.github.io/paladin/releases/${VERSION}+${BUILD_NUMBER}-windows/${APP_NAME}-${VERSION}-windows.zip" \
            --install-strategy wholeDirectoryReplace

      - name: Import release signing key
        shell: bash
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign release descriptor
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          dart run desktop_updater:release sign \
            --release "dist/${VERSION}+${BUILD_NUMBER}-windows/release.json" \
            --key-profile desktop_updater.keys.json

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

  # Snap only -- a GitHub release asset, like Android's APK, not part of the
  # desktop_updater archive/deploy step below. snapd refreshes a snap through
  # its own store/channel mechanism, which this workflow doesn't publish to;
  # this just builds the .snap and attaches it to the GitHub Release so it
  # can be installed manually (`snap install --dangerous paladin_*.snap`).
  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl git unzip xz-utils python3 jq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsqlite3-dev \
            binutils coreutils desktop-file-utils fakeroot patchelf util-linux imagemagick

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: flutter config --enable-linux-desktop
      - run: flutter create --platforms=linux .
      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release --build-number ${{ needs.prepare.outputs.build_number }}

      # The .desktop's Icon=paladin key needs a same-named file discoverable
      # alongside the installed bundle, not just the snap-store listing icon
      # under snap/gui/ -- see snap/snapcraft.yaml's desktop-entry part.
      - name: Prepare bundle assets
        run: convert assets/paladin.png -resize 512x512 build/linux/x64/release/bundle/paladin.png

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap package
        run: |
          sed -i "s/^version: .*/version: '${{ needs.prepare.outputs.version }}'/" snap/snapcraft.yaml
          snapcraft --destructive-mode

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'paladin-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'paladin_${{ needs.prepare.outputs.version }}_amd64.snap'

  # Uploads to TestFlight only -- there is no GitHub Release asset for iOS,
  # since an .ipa can't be sideloaded the way the other platforms' artifacts
  # can. Distribution to testers is entirely an App Store Connect setting (an
  # External Testing group's public link, "automatically distribute new
  # builds" turned on); this job's only job is getting a signed build there.
  #
  # Deliberately push-only (unlike the other build jobs, which also run for a
  # manual workflow_dispatch): TestFlight permanently refuses a
  # (version, build) pair it has already seen, even after deletion. A
  # re-dispatch without a fresh pubspec bump would just fail this job for no
  # reason; a genuine push to main is the only trigger that reliably means
  # "this is a new build".
  build-ios:
    needs: prepare
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      # Mirrors build-macos's cert-import shape (create keychain -> import
      # .p12 -> place the profile by UUID), swapped for an Apple Distribution
      # cert and an App Store profile. Unlike the macOS job there is no
      # ad-hoc/unsigned fallback: an app-store-method archive cannot export
      # without real signing, and TestFlight is the whole point of this job.
      - name: Import distribution certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/ios_cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios_cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/Paladin_App_Store.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/Paladin_App_Store.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/Paladin_App_Store.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # ExportOptions.plist only governs the *export* step (.xcarchive -> .ipa).
      # The *archive* step (xcodebuild archive, which is what flutter build ipa
      # runs first) still signs using the project's own settings, and the
      # committed project uses implicit CODE_SIGN_STYLE=Automatic with the team
      # set -- the right thing for day-to-day builds in Xcode, but
      # auto-provisioning needs a live Apple ID session, exactly what CI
      # doesn't have. Left unpatched, archiving fails with "No valid code
      # signing certificates were found" before ExportOptions.plist is ever
      # consulted. Same fix build-macos already applies to its own project for
      # the same reason -- verified locally against paladin's actual pbxproj
      # rather than assumed from nightmail's (whose Runner target already
      # carried an explicit CODE_SIGN_STYLE = Automatic to flip; paladin's
      # carries no such key at all, so this adds the signing keys outright
      # instead of replacing one).
      - name: Configure manual code signing for Release
        run: |
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          # TargetAttributes.ProvisioningStyle is a separate, higher-precedence
          # setting Xcode's own UI maintains; per-config CODE_SIGN_STYLE alone
          # doesn't override it. Runner currently carries neither key at all
          # (implicit Automatic).
          old_attrs = "\t\t\t\t\t97C146ED1CF9000F007C117D = {\n\t\t\t\t\t\tCreatedOnToolsVersion = 7.3.1;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t};\n"
          assert text.count(old_attrs) == 1, "Runner TargetAttributes anchor not found or not unique -- pbxproj layout changed, update this patch"
          new_attrs = "\t\t\t\t\t97C146ED1CF9000F007C117D = {\n\t\t\t\t\t\tCreatedOnToolsVersion = 7.3.1;\n\t\t\t\t\t\tDevelopmentTeam = 69XRMYD9XG;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Manual;\n\t\t\t\t\t};\n"
          text = text.replace(old_attrs, new_attrs)

          # Runner target's Release build settings carry no CODE_SIGN_STYLE key
          # at all (unlike nightmail's project, which had one to flip), so add
          # the signing keys next to PRODUCT_BUNDLE_IDENTIFIER, naming the
          # Apple Distribution identity and the "Paladin App Store" profile the
          # previous step imported by UUID. Profiles are matched by content,
          # not filename, but Xcode wants the human name here.
          start = text.index("97C147071CF9000F007C117D /* Release */ = {")
          end = text.index("name = Release;", start)
          block = text[start:end]
          old_tail = (
              "\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = au.com.sharpblue.paladin;\n"
              "\t\t\t\tPRODUCT_NAME = \"$(TARGET_NAME)\";\n"
          )
          assert block.count(old_tail) == 1, "Runner Release PRODUCT_BUNDLE_IDENTIFIER anchor not found or not unique -- pbxproj layout changed, update this patch"
          new_tail = (
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n"
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = au.com.sharpblue.paladin;\n"
              "\t\t\t\tPRODUCT_NAME = \"$(TARGET_NAME)\";\n"
              "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"Paladin App Store\";\n"
          )
          block = block.replace(old_tail, new_tail)
          text = text[:start] + block + text[end:]

          path.write_text(text)
          EOF

      - run: >
          flutter build ipa --release
          --build-number ${{ needs.prepare.outputs.build_number }}
          --export-options-plist=ios/ExportOptions.plist

      # altool reads the API key from this fixed path by Key ID -- there is
      # no flag for it. `--upload-app` maps the .ipa's bundle ID onto an
      # existing App Store Connect app record; it does not create one.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true

  # Publishes everything the in-app updater reads: the signed app-archive index
  # and each of macOS/Windows's signed release descriptor and zip. Android
  # installs its APK straight from the GitHub release, and Linux's snap and
  # iOS's TestFlight build both update through their own platform mechanisms,
  # so neither belongs in this archive -- an entry pointing at a release.json
  # that was never published here would be worse than no entry.
  deploy:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get

      - name: Download macOS distribution
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

      - name: Download Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

      - name: Update app-archive.json
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          APP_NAME="Paladin"

          git fetch origin gh-pages 2>/dev/null || true
          if git show origin/gh-pages:app-archive.json > deploy/app-archive.json 2>/dev/null \
              && jq -e '.schemaVersion == 3' deploy/app-archive.json > /dev/null 2>&1; then
            echo "Using existing schema v3 app-archive.json from gh-pages"
            # Strip the previous run's signature: upsert refuses to mutate a
            # signed index in place, and we re-sign the merged file below anyway.
            jq 'del(.signature)' deploy/app-archive.json > deploy/app-archive.json.tmp
            mv deploy/app-archive.json.tmp deploy/app-archive.json
          else
            rm -f deploy/app-archive.json
            echo "No compatible existing app-archive.json found; starting a new schema v3 index"
          fi

          for PLATFORM in macos windows; do
            dart run desktop_updater:app_archive upsert \
              --archive deploy/app-archive.json \
              --app-name "$APP_NAME" \
              --version "$VERSION" \
              --build-number "$BUILD_NUMBER" \
              --platform "$PLATFORM" \
              --channel stable \
              --release-url "https://hobleyd.github.io/paladin/releases/${VERSION}+${BUILD_NUMBER}-${PLATFORM}/release.json"
          done

      - name: Import release signing key
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign app-archive.json
        run: |
          dart run desktop_updater:release sign \
            --app-archive deploy/app-archive.json \
            --key-profile desktop_updater.keys.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
